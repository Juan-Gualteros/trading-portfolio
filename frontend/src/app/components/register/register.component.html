<div class="auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Crear Cuenta</h2>
      <p>Comienza a gestionar tu portafolio de trading hoy mismo.</p>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>
    
    <div *ngIf="successMessage" class="success-alert" style="background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; padding: 1rem; margin-bottom: 1.5rem; color: #10b981;">
      {{ successMessage }}
    </div>

    <form *ngIf="!successMessage" (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="first_name">Nombres</label>
          <input type="text" id="first_name" name="first_name" class="form-control" [(ngModel)]="userData.first_name" required>
        </div>
        <div class="form-group">
          <label for="last_name">Apellidos</label>
          <input type="text" id="last_name" name="last_name" class="form-control" [(ngModel)]="userData.last_name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" class="form-control" [(ngModel)]="userData.email" required email>
      </div>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          [(ngModel)]="userData.username" 
          required
          minlength="3"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          [(ngModel)]="userData.password" 
          required
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.form.valid || isLoading">
        {{ isLoading ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Ingresa aquí</a></p>
    </div>
  </div>
</div>
