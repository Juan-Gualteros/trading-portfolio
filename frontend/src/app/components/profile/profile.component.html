<div class="profile-header">
  <h2>Mi Perfil</h2>
  <p>Administra tu información personal y de seguridad.</p>
</div>

<div class="loader" *ngIf="isLoading">Cargando perfil...</div>

<div class="profile-container" *ngIf="!isLoading">
  <div class="profile-grid">
    <!-- Información General -->
    <div class="card form-card">
      <h3>Información General</h3>
      
      <div *ngIf="profileSuccess" class="alert text-success" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(16, 185, 129, 0.1); border-radius: 6px; border: 1px solid rgba(16,185,129,0.2);">
        {{ profileSuccess }}
      </div>
      <div *ngIf="profileError" class="alert text-danger" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border: 1px solid rgba(239,68,68,0.2); display: flex; justify-content: space-between; align-items: center;">
        <span>{{ profileError }}</span>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="loadProfile()" style="padding: 2px 10px; font-size: 0.8rem; cursor: pointer;">Reintentar</button>
      </div>

      <form (ngSubmit)="onUpdateProfile()">
        <div class="form-group">
          <label>Nombre de Usuario</label>
          <input type="text" class="form-control" name="username" [(ngModel)]="profile.username" disabled title="El nombre de usuario no se puede cambiar">
        </div>
        
        <div class="form-group">
          <label>Nombres</label>
          <input type="text" class="form-control" name="first_name" [(ngModel)]="profile.first_name" required>
        </div>
        
        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" class="form-control" name="last_name" [(ngModel)]="profile.last_name" required>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" class="form-control" name="email" [(ngModel)]="profile.email" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>

    <!-- Seguridad (Cambiar Contraseña) -->
    <div class="card form-card">
      <h3>Seguridad</h3>
      
      <div *ngIf="passwordSuccess" class="alert text-success" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(16, 185, 129, 0.1); border-radius: 6px; border: 1px solid rgba(16,185,129,0.2);">
        {{ passwordSuccess }}
      </div>
      <div *ngIf="passwordError" class="alert text-danger" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border: 1px solid rgba(239,68,68,0.2);">
        {{ passwordError }}
      </div>

      <form (ngSubmit)="onChangePassword()">
        <div class="form-group">
          <label>Contraseña Actual</label>
          <input type="password" class="form-control" name="currentPassword" [(ngModel)]="passwords.currentPassword" required>
        </div>
        
        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" class="form-control" name="newPassword" [(ngModel)]="passwords.newPassword" required minlength="6">
        </div>
        
        <div class="form-group">
          <label>Confirmar Nueva Contraseña</label>
          <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="passwords.confirmPassword" required minlength="6">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Actualizar Contraseña</button>
        </div>
      </form>
    </div>
  </div>
</div>
