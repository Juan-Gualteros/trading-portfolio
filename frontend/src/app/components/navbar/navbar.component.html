<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-brand">
      <span class="brand-badge">⚡</span>
      <span class="brand-text">Trade<span class="brand-highlight">Portfolio</span></span>
      <span class="brand-tag">PRO</span>
    </a>
    <div class="navbar-links">
      <ng-container *ngIf="isLoggedIn; else loggedOut">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">📊 Dashboard</a>
        <a routerLink="/bitacora" routerLinkActive="active" class="nav-link">📓 Bitácora</a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-link">👤 Perfil</a>
        <div class="user-menu">
          <span class="username">{{ username }}</span>
          <button (click)="logout()" class="btn-logout" title="Cerrar sesión">Salir</button>
        </div>
      </ng-container>
      <ng-template #loggedOut>
        <a routerLink="/login" class="nav-link">Ingresar</a>
        <a routerLink="/register" class="btn btn-primary">Crear Cuenta</a>
      </ng-template>
    </div>
  </div>
</nav>
